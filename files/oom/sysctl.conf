# Start background reclaim earlier (gap between watermarks: 0.1% -> 1.25% of
# RAM) so allocations rarely hit direct reclaim, which is what stalls the UI.
vm.watermark_scale_factor = 125
# Swap is zram first: swapping anon pages out is cheaper than dropping
# file cache we'll read back from disk. No readahead for zram.
vm.swappiness = 150
vm.page-cluster = 0
