# Kill the worst user cgroup (one kitty window, one oomrun scope) once memory
# pressure stays above 40% for 10s, instead of letting the session freeze.
# Candidates honor ManagedOOMPreference set by oomrun (avoid/omit).
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=40%
ManagedOOMMemoryPressureDurationSec=10s
MemoryLow=25%
