# Kill the worst user cgroup once memory pressure stays above 40% for 10s,
# instead of letting the session freeze. Candidates honor ManagedOOMPreference:
# apps first, builds and kitty windows ("avoid") last, browser/sway never.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=40%
ManagedOOMMemoryPressureDurationSec=10s
MemoryLow=25%
